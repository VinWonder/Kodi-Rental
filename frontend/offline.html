<!doctype html>
<html lang="en-KE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d6efd">
  <title>Offline · Kodi Rentals</title>
  <link rel="icon" href="/icons/favicon-32.png" type="image/png">
  <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="kodi-offline-page">
  <main class="container py-5 text-center">
    <img src="/icons/icon-192.png" alt="" width="88" height="88" class="mb-4 rounded-4 shadow-sm">
    <h1 class="h3 fw-bold">You're offline</h1>
    <p class="text-secondary mx-auto kodi-measure">
      Kodi couldn't reach the internet. Statements, invoices and receipts you've opened before are
      still saved on this device. Open the app to read them.
    </p>
    <div class="d-flex gap-2 justify-content-center flex-wrap">
      <a class="btn btn-primary" href="/#/statement">Open saved statement</a>
      <a class="btn btn-outline-secondary" href="/" id="retry">Try again</a>
    </div>
  </main>
</body>
</html>
